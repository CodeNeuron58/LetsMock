[project]
name = "viva-server"
version = "0.1.0"
description = "Viva — AI voice interviewer server (LiveKit agent + interview engine + scoring)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "livekit-agents[groq,deepgram,silero,turn-detector]",
    "pydantic>=2",
    "pydantic-settings>=2",
    "python-dotenv>=1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "groq>=0.11",
    "sqlalchemy>=2",
    # pypdf is BSD-licensed. Deliberately not PyMuPDF, which is AGPL and would
    # impose its terms on a commercial app.
    "pypdf>=5",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "reportlab>=5.0.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/viva"]

[tool.ruff]
line-length = 100
src = ["src"]
