[project]
name = "viva-server"
version = "0.1.0"
description = "Viva — AI voice interviewer server (LiveKit agent + interview engine + scoring)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "livekit-agents[groq,deepgram,silero,turn-detector]",
    "pydantic>=2",
    "pydantic-settings>=2",
    "python-dotenv>=1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "groq>=0.11",
    "sqlalchemy>=2",
    # pypdf is BSD-licensed. Deliberately not PyMuPDF, which is AGPL and would
    # impose its terms on a commercial app.
    "pypdf>=5",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "reportlab>=5.0.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/viva"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
# E402 (imports not at top) is checked so the `noqa`s in the entrypoints stay
# honest: those files must call load_dotenv() before importing anything that
# reads the environment.
extend-select = ["E402"]
# FastAPI's dependency injection *requires* `Depends()`/`File()`/`Form()` in
# argument defaults, which is exactly what B008 forbids.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The bundled starlette test client still imports httpx; nothing we control.
filterwarnings = ["ignore::DeprecationWarning:starlette.*"]
