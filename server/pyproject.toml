[project]
name = "viva-server"
version = "0.1.0"
description = "Viva — AI voice interviewer server (LiveKit agent + interview engine + scoring)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "livekit-agents[groq,deepgram,silero,turn-detector]",
    "pydantic>=2",
    "pydantic-settings>=2",
    "python-dotenv>=1",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/viva"]

[tool.ruff]
line-length = 100
src = ["src"]
